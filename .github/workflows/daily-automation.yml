name: Daily GitHub Automation

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  github-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run GitHub Automation
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          REPO_NAME: DishantDrugkar/github-automation
          FILE_PATH: README.md
          BASE_BRANCH: main
          COMMIT_MESSAGE: Automated timestamp update
          PR_TITLE: Automated Pull Request
          PR_BODY: This PR updates the timestamp automatically.
          ISSUE_TITLE: Automated GitHub Issue
          ISSUE_BODY: This issue was created using Python automation.

        run: python github_auto.py
